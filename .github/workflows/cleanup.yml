name: Cleanup Artifacts

on:
  schedule:
    - cron: '0 2 * * 6'  # Weekly cleanup
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Required to delete artifacts
      contents: read
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            try {
              let page = 1;
              let totalDeleted = 0;
              
              while (true) {
                const artifacts = await github.rest.actions.listArtifactsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                  page: page
                });
                
                if (artifacts.data.artifacts.length === 0) {
                  break;
                }
                
                const cutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000); // 7 days ago
                
                for (const artifact of artifacts.data.artifacts) {
                  if (new Date(artifact.created_at) < cutoff) {
                    try {
                      await github.rest.actions.deleteArtifact({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        artifact_id: artifact.id
                      });
                      console.log(`Deleted artifact: ${artifact.name} (ID: ${artifact.id})`);
                      totalDeleted++;
                    } catch (deleteError) {
                      console.log(`Failed to delete artifact ${artifact.name}: ${deleteError.message}`);
                    }
                  } else {
                    console.log(`Keeping artifact: ${artifact.name} (created: ${artifact.created_at})`);
                  }
                }
                
                page++;
              }
              
              console.log(`Total artifacts deleted: ${totalDeleted}`);
              
            } catch (error) {
              console.error('Error during cleanup:', error.message);
              process.exit(1);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}